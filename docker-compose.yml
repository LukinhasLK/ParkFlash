# Sobe o PostgreSQL para desenvolvimento/apresentação:
#   docker compose up -d
# Depois rode o back end com o perfil postgres (ver README).
services:
  postgres:
    image: postgres:17-alpine
    container_name: parkflash-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: parkflash
      POSTGRES_USER: parkflash
      POSTGRES_PASSWORD: parkflash
    # 127.0.0.1: só aceita conexões desta máquina, não da rede.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - parkflash-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parkflash"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  parkflash-pgdata:
